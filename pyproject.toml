[project]
name = "mail-agent-mvp"
version = "0.1.0"
description = "Read-only MVP scaffold for an IMAP + SQLite + Telegram mail agent."
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.0",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.2",
  "python-dotenv>=1.0.1",
  "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
mail-agent = "mail_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mail_agent"]
